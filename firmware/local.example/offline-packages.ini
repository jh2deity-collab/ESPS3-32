; PlatformIO 패키지 레지스트리(dl.registry.platformio.org)에 접근할 수 없는
; 망분리/사내 프록시 환경에서, 같은 소스를 업스트림 GitHub 릴리스에서 직접 받는다.
;
; 버전은 espressif32 6.9.0 이 쓰는 것과 같게 맞춰 두었다.
;   - Arduino core 2.0.17
;   - xtensa gcc 8.4.0 (esp-2021r2-patch5)
; 플랫폼 버전을 올리면 이 URL 들도 함께 확인할 것.
[env:esp32s3-n8r2]
platform = https://github.com/platformio/platform-espressif32.git#v6.9.0
platform_packages =
  toolchain-xtensa-esp32 @ https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
  toolchain-xtensa-esp32s3 @ https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32s3-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.17/esp32-2.0.17.zip
  ; esptool 은 릴리스 자산이 실행 파일이라 PyPI 소스를 풀어서 쓴다.
  ; (pip download esptool==4.5.1 --no-deps --no-binary :all: 로 받은 뒤
  ;  package.json 에 {"name":"tool-esptoolpy","version":"1.40501.0"} 를 넣는다)
  ; tool-esptoolpy @ symlink:///절대/경로/tool-esptoolpy
lib_deps =
  https://github.com/bblanchon/ArduinoJson.git#v7.1.0
  https://github.com/Links2004/arduinoWebSockets.git#2.6.1
