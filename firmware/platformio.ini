; ESP32-S3-WROOM-1 N8R2 (8MB Quad Flash / 2MB Quad PSRAM)
; I/O 테스트 타깃 펌웨어 - USB CDC / BLE / WiFi(WebSocket) 3-채널 동시 지원

[env:esp32s3-n8r2]
platform  = espressif32@^6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- N8R2 메모리 구성 -------------------------------------------------------
; N8R2 = 8MB Quad SPI Flash + 2MB Quad SPI PSRAM
; (옥탈 모듈인 N8R8 과 달리 memory_type 은 qio_qspi 여야 한다)
board_build.mcu               = esp32s3
board_build.flash_mode        = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size       = 8MB
board_upload.maximum_size     = 8388608
board_build.partitions        = default_8MB.csv

; --- 네이티브 USB 를 CDC(시리얼)로 사용 -------------------------------------
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"1.0.0\"

monitor_speed   = 115200
upload_speed    = 921600

lib_deps =
  bblanchon/ArduinoJson@^7.1.0
  links2004/WebSockets@^2.6.1
